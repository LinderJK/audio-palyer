<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="player">
        <div class="player__title title">
          <div class="title__song-image">
            <img id="songCover" src="./assets/image/title-song.png" />
          </div>
          <div class="title__song-info">
            <p>Now Playing</p>
            <p id="songAutor">Purple haze</p>
            <p id="songName">Jimi hendrix Woodstock</p>
          </div>
        </div>

        <div class="player__nav nav">
          <div class="nav__button">
            <button class="button button-prev" id="buttonPrev"><span></span></button>
            <button class="button button-stop" id="buttonPause"><span></span></button>
            <button class="button button-next" id="buttonNext"><span></span></button>
            
          </div>
          <div class="nav__progress-bar">
            <div class="progress-bar__time-start">1</div>
            <div class="progress-bar__item"></div>
            <div class="progress-bar__time-end">2</div>
            <!-- <p>this is scrioll</p> -->
          </div>

        </div>

      </div>
    </div>
    <div class="footer">
        123
    </div>
  </div>
  <script src="./js/script.js" type="text/javascript"></script>
</body>
</html>
